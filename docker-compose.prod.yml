services:
  db:
    image: postgres:15-alpine
    container_name: smartcontact_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-smartcontact}
    volumes:
      - smartcontact_prod_data:/var/lib/postgresql/data
    networks:
      - smartcontact-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartcontact}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smartcontact_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_DATABASE: ${POSTGRES_DB:-smartcontact}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
    networks:
      - smartcontact-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: smartcontact_web
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - api
    networks:
      - smartcontact-network

networks:
  smartcontact-network:
    driver: bridge

volumes:
  smartcontact_prod_data:
