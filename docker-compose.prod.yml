services:
  db:
    image: postgres:16-alpine
    container_name: smartcontact_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-smartcontact}
    volumes:
      - smartcontact_prod_pgdata:/var/lib/postgresql/data
    networks:
      - smartcontact-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-smartcontact}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: smartcontact_api_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_DATABASE: ${DB_DATABASE:-smartcontact}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      NODE_ENV: production
      PORT: 3000
    networks:
      - smartcontact-network
      - webproxy # <-- API conectada ao Nginx

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: smartcontact_web_prod
    restart: always
    # REMOVIDO: ports: - "8081:80" (O Nginx assume isso agora)
    depends_on:
      - api
    networks:
      - smartcontact-network
      - webproxy # <-- Frontend conectado ao Nginx

networks:
  smartcontact-network:
    driver: bridge
  webproxy: # <-- Declaração da rede do proxy
    external: true

volumes:
  smartcontact_prod_pgdata: