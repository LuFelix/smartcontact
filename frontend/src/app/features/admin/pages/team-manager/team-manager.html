<div class="manager-container">
    <app-page-header title="Gestão de Equipe">
        <!-- Ações do Header -->
        <div header-actions>
            <button mat-stroked-button (click)="layoutService.toggleLayout()">
                <mat-icon>{{ layoutService.layout() === 'moderno' ? 'view_list' : 'grid_view' }}</mat-icon>
                {{ layoutService.layout() === 'moderno' ? 'Ver em Lista' : 'Ver em Cards' }}
            </button>
        </div>
    </app-page-header>

    <div class="manager-tabs-container">
        <mat-tab-group color="primary">
            <!-- ABA 1: MEMBROS -->
            <mat-tab>
                <ng-template mat-tab-label>
                    <mat-icon class="tab-icon">group</mat-icon>
                    Membros da Equipe
                </ng-template>

                <div class="tab-content">
                    <div class="tab-actions">
                        <app-search-bar 
                            placeholder="Buscar membro..." 
                            [initialValue]="searchTerm"
                            (search)="searchTerm = $event">
                        </app-search-bar>

                        <button mat-flat-button color="primary" (click)="openInvitationDialog()">
                            <mat-icon>person_add</mat-icon> Adicionar Membro
                        </button>
                    </div>

                    @if (!isLoadingMembers && filteredMembers.length === 0) {
                        <app-empty-state
                            [icon]="searchTerm ? 'search_off' : 'group_add'"
                            [title]="searchTerm ? 'Nenhum membro encontrado' : 'Nenhum membro na equipe'"
                            [message]="searchTerm ? 'Tente ajustar sua busca por nome ou e-mail.' : 'Comece adicionando membros para gerenciar seu workspace.'"
                            [actionLabel]="searchTerm ? '' : 'Adicionar Membro'"
                            (action)="openInvitationDialog()">
                        </app-empty-state>
                    } @else {
                        @if (layoutService.layout() === 'moderno') {
                            <app-members-card-list
                                [members]="filteredMembers"
                                [isLoading]="isLoadingMembers"
                                (delegateResources)="openDelegationDialog($event)"
                                (removeMember)="removeMember($event)">
                            </app-members-card-list>
                        } @else {
                            <app-members-list-view
                                [members]="filteredMembers"
                                [isLoading]="isLoadingMembers"
                                (delegateResources)="openDelegationDialog($event)"
                                (removeMember)="removeMember($event)">
                            </app-members-list-view>
                        }
                    }
                </div>
            </mat-tab>

            <!-- ABA 2: CONFIGURAÇÕES -->
            <mat-tab>
                <ng-template mat-tab-label>
                    <mat-icon class="tab-icon">settings</mat-icon>
                    Configurações do Workspace
                </ng-template>

                <div class="tab-content">
                    <app-empty-state
                        icon="construction"
                        title="Em Construção"
                        message="Em breve você poderá configurar permissões customizadas, logos do workspace e integrações premium aqui.">
                    </app-empty-state>
                </div>
            </mat-tab>
        </mat-tab-group>
    </div>
</div>
