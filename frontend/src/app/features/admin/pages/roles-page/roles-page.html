<div class="roles-container">
    <mat-card class="roles-card">
        <mat-card-header class="header-with-action">
            <div>
                <mat-card-title>Gestão de Funções (Roles)</mat-card-title>
                <mat-card-subtitle>Gerencie os níveis de acesso do sistema (RBAC)</mat-card-subtitle>
            </div>
            <div class="header-actions">
                <mat-form-field appearance="outline" class="search-field">
                    <mat-label>Filtrar roles...</mat-label>
                    <mat-icon matPrefix>search</mat-icon>
                    <input matInput [(ngModel)]="searchTerm" placeholder="Nome ou descrição">
                    @if (searchTerm) {
                        <button mat-icon-button matSuffix (click)="searchTerm = ''" aria-label="Clear">
                            <mat-icon>close</mat-icon>
                        </button>
                    }
                </mat-form-field>

                <button mat-stroked-button (click)="layoutService.toggleLayout()" class="layout-toggle-btn">
                    <mat-icon>{{ layoutService.layout() === 'moderno' ? 'view_list' : 'grid_view' }}</mat-icon>
                    {{ layoutService.layout() === 'moderno' ? 'Visualizar Lista' : 'Visualizar Cards' }}
                </button>
                <button mat-raised-button color="primary" (click)="openRoleDialog()">
                    <mat-icon>add</mat-icon> Nova Role
                </button>
            </div>
        </mat-card-header>

        <mat-card-content>
            @if (layoutService.layout() === 'moderno') {
                <app-roles-card-list
                    [roles]="filteredRoles"
                    [isLoading]="isLoading"
                    (editRole)="openRoleDialog($event)"
                    (deleteRole)="deleteRole($event)">
                </app-roles-card-list>
            } @else {
                <app-roles-list-view
                    [roles]="filteredRoles"
                    [isLoading]="isLoading"
                    (editRole)="openRoleDialog($event)"
                    (deleteRole)="deleteRole($event)">
                </app-roles-list-view>
            }
        </mat-card-content>
    </mat-card>
</div>
