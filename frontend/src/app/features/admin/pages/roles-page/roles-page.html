<div class="roles-container">
    <mat-card class="user-card">
        <mat-card-header class="custom-card-header">
            <div>
                <mat-card-title>Gestão de Funções (Roles)</mat-card-title>
                <mat-card-subtitle>Gerencie os níveis de acesso do sistema (RBAC)</mat-card-subtitle>
            </div>
            <div class="header-actions">
                <button mat-stroked-button (click)="layoutService.toggleLayout()" class="layout-toggle-btn">
                    <mat-icon>{{ layoutService.layout() === 'moderno' ? 'view_list' : 'grid_view' }}</mat-icon>
                    {{ layoutService.layout() === 'moderno' ? 'Visualizar Lista' : 'Visualizar Cards' }}
                </button>
                <button mat-raised-button color="primary" (click)="openRoleDialog()">
                    <mat-icon>add</mat-icon> Nova Role
                </button>
            </div>
        </mat-card-header>

        <mat-card-content style="padding-top: 24px;">
            @if (layoutService.layout() === 'moderno') {
                <app-roles-card-list
                    [roles]="roles"
                    [isLoading]="isLoading"
                    (editRole)="openRoleDialog($event)"
                    (deleteRole)="deleteRole($event)">
                </app-roles-card-list>
            } @else {
                <app-roles-list-view
                    [roles]="roles"
                    [isLoading]="isLoading"
                    (editRole)="openRoleDialog($event)"
                    (deleteRole)="deleteRole($event)">
                </app-roles-list-view>
            }
        </mat-card-content>
    </mat-card>
</div>
