<div class="roles-container">
    <mat-card class="roles-card">
        <mat-card-header class="header-with-action">
            <div>
                <mat-card-title>Gestão de Funções (Roles)</mat-card-title>
                <mat-card-subtitle>Gerencie os níveis de acesso do sistema (RBAC)</mat-card-subtitle>
            </div>
            <button mat-raised-button color="primary" (click)="openRoleDialog()">
                <mat-icon>add</mat-icon> Nova Role
            </button>
        </mat-card-header>

        <mat-card-content>
            @if (isLoading) {
                <div class="loading-overlay">
                    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
                </div>
            }

            <div class="table-container">
                <table mat-table [dataSource]="roles" class="w-full">
                    <!-- ID Column -->
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let role"> {{ role.id | slice:0:8 }}... </td>
                    </ng-container>

                    <!-- Name Column -->
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef> Nome </th>
                        <td mat-cell *matCellDef="let role"> <strong>{{ role.name }}</strong> </td>
                    </ng-container>

                    <!-- Description Column -->
                    <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef> Descrição </th>
                        <td mat-cell *matCellDef="let role"> {{ role.description || 'Sem descrição' }} </td>
                    </ng-container>

                    <!-- Actions Column -->
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef class="text-right"> Ações </th>
                        <td mat-cell *matCellDef="let role" class="text-right">
                            <button mat-icon-button color="primary" (click)="openRoleDialog(role)" matTooltip="Editar">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="deleteRole(role)" matTooltip="Excluir">
                                <mat-icon>delete_outline</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <!-- Row shown when there is no matching data. -->
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell no-data-msg" colspan="4">
                            Nenhuma role cadastrada ou encontrada.
                        </td>
                    </tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</div>
