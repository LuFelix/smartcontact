<div class="roles-container">
    <app-page-header title="Gestão de Funções (Roles)">
        <div header-actions>
            <button mat-stroked-button (click)="layoutService.toggleLayout()" class="layout-toggle-btn">
                <mat-icon>{{ layoutService.layout() === 'moderno' ? 'view_list' : 'grid_view' }}</mat-icon>
                {{ layoutService.layout() === 'moderno' ? 'Ver em Lista' : 'Ver em Cards' }}
            </button>
            <button mat-flat-button color="primary" (click)="openRoleDialog()">
                <mat-icon>add</mat-icon> Nova Role
            </button>
        </div>
    </app-page-header>

    <div class="roles-content">
        <div class="roles-actions">
            <app-search-bar
                placeholder="Filtrar roles..."
                [initialValue]="searchTerm"
                (search)="searchTerm = $event">
            </app-search-bar>
        </div>

        @if (!isLoading && filteredRoles.length === 0) {
            <app-empty-state
                [icon]="searchTerm ? 'search_off' : 'admin_panel_settings'"
                [title]="searchTerm ? 'Nenhuma role encontrada' : 'Nenhuma role cadastrada'"
                [message]="searchTerm ? 'Tente ajustar sua busca por nome ou descrição.' : 'As roles definem o que cada usuário pode fazer no sistema.'"
                [actionLabel]="searchTerm ? '' : 'Criar Nova Role'"
                (action)="openRoleDialog()">
            </app-empty-state>
        } @else {
            @if (layoutService.layout() === 'moderno') {
                <app-roles-card-list
                    [roles]="filteredRoles"
                    [isLoading]="isLoading"
                    (editRole)="openRoleDialog($event)"
                    (deleteRole)="deleteRole($event)">
                </app-roles-card-list>
            } @else {
                <app-roles-list-view
                    [roles]="filteredRoles"
                    [isLoading]="isLoading"
                    (editRole)="openRoleDialog($event)"
                    (deleteRole)="deleteRole($event)">
                </app-roles-list-view>
            }
        }
    </div>
</div>
