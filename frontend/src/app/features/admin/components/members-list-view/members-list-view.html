<div class="table-container">
    @if (isLoading) {
        <div class="loading-overlay">
            <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
        </div>
    }

    <table mat-table [dataSource]="members" class="w-full">
        
        <ng-container matColumnDef="avatar">
            <th mat-header-cell *matHeaderCellDef> </th>
            <td mat-cell *matCellDef="let member"> 
                <img [src]="getAvatar(member)" class="list-avatar">
            </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let member"> <strong>{{ member.name }}</strong> </td>
        </ng-container>

        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> E-mail </th>
            <td mat-cell *matCellDef="let member"> {{ member.email }} </td>
        </ng-container>

        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> Cargo </th>
            <td mat-cell *matCellDef="let member"> {{ member.role?.name | titlecase }} </td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let member"> 
                <span class="status-chip" [class.verified]="member.isVerified">
                    {{ member.isVerified ? 'Verificado' : 'Pendente' }}
                </span>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-right"> Ações </th>
            <td mat-cell *matCellDef="let member" class="text-right">
                <button mat-icon-button color="accent" (click)="delegateResources.emit(member)" matTooltip="Gerenciar Acessos">
                    <mat-icon>key</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="removeMember.emit(member)" matTooltip="Remover">
                    <mat-icon>person_remove</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data-msg" colspan="6">
                Nenhum membro encontrado.
            </td>
        </tr>
    </table>
</div>
