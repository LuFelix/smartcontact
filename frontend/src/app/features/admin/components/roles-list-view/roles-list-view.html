<div class="table-container">
    @if (isLoading) {
        <div class="loading-overlay">
            <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
        </div>
    }

    <table mat-table [dataSource]="roles" class="w-full">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let role"> <strong>{{ role.name }}</strong> </td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Descrição </th>
            <td mat-cell *matCellDef="let role"> {{ role.description || 'Sem descrição' }} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-right"> Ações </th>
            <td mat-cell *matCellDef="let role" class="text-right">
                <button mat-icon-button color="primary" class="icon-align-fix" (click)="editRole.emit(role)" matTooltip="Editar">
                    <mat-icon>edit</mat-icon>
                </button>
                
                @if (role.name !== 'administrador' && role.name !== 'usuario') {
                    <button mat-icon-button color="warn" class="icon-align-fix" (click)="deleteRole.emit(role)" matTooltip="Excluir">
                        <mat-icon>delete_outline</mat-icon>
                    </button>
                }
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data-msg" colspan="3">
                Nenhuma role encontrada.
            </td>
        </tr>
    </table>
</div>
