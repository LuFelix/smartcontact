<div class="table-container">
    @if (isLoading) {
        <div class="loading-overlay">
            <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
        </div>
    }

    <table mat-table [dataSource]="leads" class="w-full">
        
        <ng-container matColumnDef="leadName">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let lead"> <strong>{{ lead.leadName }}</strong> </td>
        </ng-container>

        <ng-container matColumnDef="leadEmail">
            <th mat-header-cell *matHeaderCellDef> E-mail </th>
            <td mat-cell *matCellDef="let lead"> {{ lead.leadEmail }} </td>
        </ng-container>

        <ng-container matColumnDef="leadPhone">
            <th mat-header-cell *matHeaderCellDef> Telefone </th>
            <td mat-cell *matCellDef="let lead"> {{ lead.leadPhone || '-' }} </td>
        </ng-container>

        <ng-container matColumnDef="leadNote">
            <th mat-header-cell *matHeaderCellDef> Nota/Contexto </th>
            <td mat-cell *matCellDef="let lead"> {{ lead.leadNote || '-' }} </td>
        </ng-container>

        <ng-container matColumnDef="accessedAt">
            <th mat-header-cell *matHeaderCellDef> Data </th>
            <td mat-cell *matCellDef="let lead"> {{ lead.accessedAt | date:'dd/MM/yyyy HH:mm' }} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-right"> Ações </th>
            <td mat-cell *matCellDef="let lead" class="text-right">
                <button mat-flat-button color="primary" 
                        (click)="saveToGoogle.emit(lead)" 
                        [disabled]="isSavingToGoogle">
                    <mat-icon>person_add</mat-icon> Salvar no Google
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data-msg" colspan="6">
                Nenhum lead encontrado.
            </td>
        </tr>
    </table>
</div>
