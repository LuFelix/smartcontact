<div class="leads-container">
    <mat-card class="user-card">
        <mat-card-header class="custom-card-header">
            <div>
                <mat-card-title>Meus Leads Capturados</mat-card-title>
                <mat-card-subtitle>Visualize os dados deixados por quem escaneou sua Tag</mat-card-subtitle>
            </div>
            <div class="header-actions">
                <button mat-stroked-button (click)="layoutService.toggleLayout()">
                    <mat-icon>{{ layoutService.layout() === 'moderno' ? 'view_list' : 'grid_view' }}</mat-icon>
                    {{ layoutService.layout() === 'moderno' ? 'Ver em Lista' : 'Ver em Cards' }}
                </button>
            </div>
        </mat-card-header>

        <mat-card-content style="padding-top: 24px;">
            @if (layoutService.layout() === 'moderno') {
                <app-leads-card-list
                    [leads]="leads"
                    [isLoading]="isLoading"
                    (saveToGoogle)="saveToGoogle($event)">
                </app-leads-card-list>
            } @else {
                <app-leads-list-view
                    [leads]="leads"
                    [isLoading]="isLoading"
                    (saveToGoogle)="saveToGoogle($event)">
                </app-leads-list-view>
            }
        </mat-card-content>
    </mat-card>
</div>
