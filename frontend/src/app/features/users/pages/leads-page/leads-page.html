<div class="leads-container">
    <mat-card class="leads-card">
        <mat-card-header class="header-with-action">
            <div>
                <mat-card-title>Meus Leads Capturados</mat-card-title>
                <mat-card-subtitle>Contatos que escanearam sua tag e deixaram informações</mat-card-subtitle>
            </div>
            <div class="header-actions">
                <mat-form-field appearance="outline" class="search-field">
                    <mat-label>Filtrar leads...</mat-label>
                    <mat-icon matPrefix>search</mat-icon>
                    <input matInput [(ngModel)]="searchTerm" placeholder="Nome, e-mail ou telefone">
                    @if (searchTerm) {
                        <button mat-icon-button matSuffix (click)="searchTerm = ''" aria-label="Clear">
                            <mat-icon>close</mat-icon>
                        </button>
                    }
                </mat-form-field>

                <button mat-stroked-button (click)="layoutService.toggleLayout()" class="layout-toggle-btn">
                    <mat-icon>{{ layoutService.layout() === 'moderno' ? 'view_list' : 'grid_view' }}</mat-icon>
                    {{ layoutService.layout() === 'moderno' ? 'Visualizar Lista' : 'Visualizar Cards' }}
                </button>
            </div>
        </mat-card-header>

        <mat-card-content>
            @if (layoutService.layout() === 'moderno') {
                <app-leads-card-list
                    [leads]="filteredLeads"
                    [isLoading]="isLoading"
                    [isSavingToGoogle]="isSavingToGoogle"
                    (saveToGoogle)="saveToGoogle($event)">
                </app-leads-card-list>
            } @else {
                <app-leads-list-view
                    [leads]="filteredLeads"
                    [isLoading]="isLoading"
                    [isSavingToGoogle]="isSavingToGoogle"
                    (saveToGoogle)="saveToGoogle($event)">
                </app-leads-list-view>
            }
        </mat-card-content>
    </mat-card>
</div>
