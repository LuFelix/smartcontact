<div class="leads-container">
    <app-page-header title="Meus Leads Capturados">
        <div header-actions>
            <button mat-stroked-button (click)="layoutService.toggleLayout()" class="layout-toggle-btn">
                <mat-icon>{{ layoutService.layout() === 'moderno' ? 'view_list' : 'grid_view' }}</mat-icon>
                {{ layoutService.layout() === 'moderno' ? 'Ver em Lista' : 'Ver em Cards' }}
            </button>
        </div>
    </app-page-header>

    <div class="leads-content">
        <div class="leads-actions">
            <app-search-bar
                placeholder="Filtrar leads..."
                [initialValue]="searchTerm"
                (search)="searchTerm = $event">
            </app-search-bar>
        </div>

        @if (!isLoading && filteredLeads.length === 0) {
            <app-empty-state
                [icon]="searchTerm ? 'search_off' : 'contact_mail'"
                [title]="searchTerm ? 'Nenhum lead encontrado' : 'Você ainda não possui leads'"
                [message]="searchTerm ? 'Tente ajustar sua busca por nome, e-mail ou telefone.' : 'Compartilhe sua tag para começar a capturar contatos automaticamente.'">
            </app-empty-state>
        } @else {
            @if (layoutService.layout() === 'moderno') {
                <app-leads-card-list
                    [leads]="filteredLeads"
                    [isLoading]="isLoading"
                    [isSavingToGoogle]="isSavingToGoogle"
                    (saveToGoogle)="saveToGoogle($event)">
                </app-leads-card-list>
            } @else {
                <app-leads-list-view
                    [leads]="filteredLeads"
                    [isLoading]="isLoading"
                    [isSavingToGoogle]="isSavingToGoogle"
                    (saveToGoogle)="saveToGoogle($event)">
                </app-leads-list-view>
            }
        }
    </div>
</div>
