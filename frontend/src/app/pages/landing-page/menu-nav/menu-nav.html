<nav class="navbar" [class.scrolled]="showButton">
  <div class="nav-container">
    <button mat-icon-button class="hamburger" aria-label="Abrir menu" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
      <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>

    <div class="logo-container" (click)="scrollToTop()">
      <img src="mas-logo.svg" alt="SmartContact Logo" class="logo" />
      <span class="brand-name">
        <span class="smart">Smart</span><span class="contact">Contact</span>
      </span>
    </div>

    <ul class="nav-links" [class.open]="menuOpen">
      <li><a href="#about" (click)="closeMenu()">O Projeto</a></li>
      <li><a href="#jobs" (click)="closeMenu()">Carreiras</a></li>
      <li><a href="#contact" (click)="closeMenu()">Contato</a></li>
      <li class="login-item">
        <a href="/login" mat-flat-button color="primary" class="login-btn-nav" (click)="closeMenu()">
          Acessar Painel
        </a>
      </li>
    </ul>

    <div class="actions">
      <button mat-icon-button (click)="toggleDarkMode()" aria-label="Alternar modo escuro" class="theme-toggle-btn">
        <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </div>
</nav>

<button mat-fab class="btn-top" [class.show]="showButton" (click)="scrollToTop()"
  aria-label="Voltar ao topo">
  <mat-icon>arrow_upward</mat-icon>
</button>
