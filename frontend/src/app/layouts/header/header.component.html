<mat-toolbar class="main-header">
  <div class="header-content">
    <!-- Botão Hamburger para alternar Sidenav -->
    <button mat-icon-button (click)="emitToggleSidenav()" aria-label="Toggle sidenav" class="hamburger-btn">
      <mat-icon>{{ sidenavOpen ? 'menu_open' : 'menu' }}</mat-icon>
    </button>

    <div class="brand">
        <img src="logo.svg" alt="Logo" class="logo-img">
        <span class="brand-name">SmartContact</span>
    </div>

    <span class="spacer"></span>

    <!-- Botões de Ação Direta -->
    <button mat-icon-button (click)="toggleDarkMode()" matTooltip="Alternar Tema" class="theme-toggle-btn">
      <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <button mat-icon-button matTooltip="Notificações" class="notification-button">
        <mat-icon [matBadge]="notificationCount" matBadgeColor="warn">notifications</mat-icon>
    </button>

    <!-- Menu do Usuário -->
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
      <div class="header-avatar" [style.background-color]="getAvatarColor()">
        @if (profileImage; as avatarUrl) {
            <img [src]="avatarUrl" (error)="handleImageError($event)" class="header-avatar-img">
        } @else {
            <span class="letter-placeholder">{{ getInitial() }}</span>
        }
      </div>
      <span class="user-name">{{ userName() || 'Usuário' }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="navigateToProfile()">
        <mat-icon>person</mat-icon>
        <span>Meu Perfil</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
