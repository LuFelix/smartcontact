<mat-toolbar class="main-header">
  <div class="header-content">
    <!-- Botão Hamburger para alternar Sidenav -->
    <button mat-icon-button (click)="emitToggleSidenav()" aria-label="Toggle sidenav" class="hamburger-btn">
      <mat-icon>{{ sidenavOpen ? 'menu_open' : 'menu' }}</mat-icon>
    </button>

    <div class="brand-container" (click)="navigateToProfile()">
      <img src="/mas-logo.svg" alt="SmartContact Logo" class="logo">
      <span class="brand-name">
        <span class="smart">Smart</span><span class="contact">Contact</span>
      </span>
    </div>

    <!-- Espaçador para empurrar itens para a direita -->
    <span class="spacer"></span>

    <!-- Botão de Notificações (Exemplo) -->
    <button mat-icon-button (click)="toggleDarkMode()" aria-label="Alternar modo escuro" class="theme-toggle-button">
      <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <button mat-icon-button aria-label="Notificações" class="notification-button">
       <mat-icon matBadge="{{ notificationCount > 0 ? notificationCount : '' }}"
                 matBadgeColor="warn"
                 [matBadgeHidden]="notificationCount === 0">notifications</mat-icon>
    </button>

    <!-- Menu do Usuário -->
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
      <!-- Foto/Ícone do Usuário -->
      <div class="header-avatar" [style.background-color]="getAvatarColor()">
        @if (profileImage; as avatarUrl) {
            <img [src]="avatarUrl" (error)="handleImageError($event)">
        }
        <span class="letter-placeholder">{{ getInitial() }}</span>
      </div>
      <span class="user-name">{{ userName() || 'Usuário' }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="navigateToProfile()">
        <mat-icon>person</mat-icon>
        <span>Meu Perfil</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
